# PulseGuard original rule for mysql/pg/sqlite-style calls; no registry reuse.
# Focus on SQL text: a constant query with a separate parameter array is safe.
# Supplying a parameter array does not sanitize an already interpolated SQL string.
rules:
  - id: javascript-sqli-taint
    languages: [javascript, typescript]
    mode: taint
    severity: ERROR
    message: Request input reaches SQL text; use placeholders and a separate parameter array.
    metadata:
      cwe: CWE-89
      category: security
    pattern-sources:
      - pattern: req.query
      - pattern: req.params
      - pattern: req.body
      - pattern: req.headers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
              - pattern: $DB.all($Q, ...)
              - pattern: $DB.get($Q, ...)
              - pattern: $DB.run($Q, ...)
              - pattern: $DB.exec($Q, ...)
          - focus-metavariable: $Q
