name: Deployment health
"on":
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Load last deployed endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/gcp/pages_endpoint.py
      - name: Probe both deployments
        run: python3 -m deploy.gcp.health_check
