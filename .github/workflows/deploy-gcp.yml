name: Deploy GCP
"on":
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
concurrency:
  group: pulseguard-gcp-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
      GCP_SERVICE: ${{ vars.GCP_SERVICE }}
    steps:
      - name: Check optional GCP configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA GCP_SERVICE; do
            if [[ -z "${!name}" ]]; then
              echo "::notice::GCP deployment skipped: $name is absent; Render remains available."
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.config.outputs.enabled == 'true'
        with:
          # Deploy the exact CI-tested push, never a PR artifact or its code.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Authenticate with GitHub OIDC
        id: auth
        if: steps.config.outputs.enabled == 'true'
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Explain unavailable authentication
        if: steps.config.outputs.enabled == 'true' && steps.auth.outcome == 'failure'
        run: echo '::notice::GCP authentication unavailable; skipping deployment. Render remains available.'
      - name: Set up gcloud
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@26f734c2779b00b7dda794207734c511110a4368 # v3.0.0
      - name: Check GCP availability
        id: available
        if: steps.auth.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if gcloud run services describe "$GCP_SERVICE" --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" --format='value(metadata.name)' >/dev/null; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::GCP service unavailable; skipping deployment. Render remains available.'
          fi
      - name: Build, deploy by digest and smoke-test
        id: deploy
        if: steps.available.outputs.ready == 'true'
        shell: bash
        env:
          GCP_IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if bash deploy/gcp/deploy.sh 2>&1 | tee "$RUNNER_TEMP/gcp-deploy.log"; then
            echo 'deployed=true' >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'BILLING_DISABLED|PROJECT_BILLING_INFO_NOT_FOUND|CONSUMER_SUSPENDED|billing.{0,100}(disabled|closed|suspended|not.found|not.enabled|must be enabled)|invalid_grant|invalid_target|UNAUTHENTICATED' "$RUNNER_TEMP/gcp-deploy.log"; then
            echo '::notice::GCP billing or authentication unavailable; Render remains available.'
          else
            exit 1
          fi
      - name: Preserve front-door endpoint for Pages
        if: steps.deploy.outputs.deployed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcp-endpoint
          path: site/endpoints.json
          retention-days: 90
