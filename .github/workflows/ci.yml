name: CI
"on":
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SEMGREP_SEND_METRICS: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tests, Bandit, Semgrep and optional streaming dependencies
        run: python -m pip install -e ".[dev,scan,stream]"
      - name: Install checksum-verified Trivy
        shell: bash
        env:
          TRIVY_VERSION: "0.69.3"
          TRIVY_SHA256: 1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          download_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}" \
            --output "${download_dir}/${archive}"
          printf '%s  %s\n' "$TRIVY_SHA256" "${download_dir}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/pulseguard-bin"
          tar -xzf "${download_dir}/${archive}" -C "${RUNNER_TEMP}/pulseguard-bin" trivy
          echo "${RUNNER_TEMP}/pulseguard-bin" >> "$GITHUB_PATH"
      - name: Verify scanner installations
        run: |
          python -m bandit --version
          python -m semgrep --version
          trivy --version
      - run: python -m ruff check .
      - name: Unit, runtime and Bandit tests
        run: python -m pytest -q -rs -m "not semgrep and not trivy"
      - name: Real Semgrep tests (Linux)
        run: python -m pytest -q -rs -m semgrep
      - name: Real Trivy tests
        env:
          PG_TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: python -m pytest -q -rs -m trivy
      - run: python -m pulseguard.contracts.validate
      - run: python -m pulseguard.replay.verify
