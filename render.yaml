services:
  - type: web
    name: pulseguard
    runtime: docker
    repo: https://github.com/witold-andelie/PulseGuard
    branch: main
    plan: free
    region: frankfurt
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: PG_MODE              # replay | live
        value: replay
      - key: PG_DB_PATH
        value: /tmp/pulseguard.sqlite
      - key: PG_MODEL_BASE_URL    # decided later; set in the dashboard
        sync: false
      - key: PG_MODEL_NAME
        sync: false
      - key: PG_MODEL_API_KEY
        sync: false
      - key: PG_LIVE_TOKEN        # Bearer token for POST/GET /api/runs; required in LIVE [S3]
        sync: false
      - key: PG_PLAYGROUND_DAILY_CALLS
        value: "300"
      - key: PG_PLAYGROUND_TIMEOUT_S
        sync: false
      - key: PG_PLAYGROUND_MUSE_BASE_URL
        sync: false
      - key: PG_PLAYGROUND_MUSE_NAME
        sync: false
      - key: PG_PLAYGROUND_MUSE_API_KEY
        sync: false
      - key: PG_PLAYGROUND_MUSE_STRUCTURED
        sync: false
      - key: PG_PLAYGROUND_MUSE_EXTRA_BODY
        sync: false
      - key: PG_PLAYGROUND_MUSE_SESSION_HEADER
        sync: false
      - key: PG_PLAYGROUND_MUSE_TIMEOUT_S
        sync: false
      - key: PG_PLAYGROUND_NEMOTRON_BASE_URL
        sync: false
      - key: PG_PLAYGROUND_NEMOTRON_NAME
        sync: false
      - key: PG_PLAYGROUND_NEMOTRON_API_KEY
        sync: false
      - key: PG_PLAYGROUND_NEMOTRON_STRUCTURED
        sync: false
      - key: PG_PLAYGROUND_NEMOTRON_EXTRA_BODY
        sync: false
      - key: PG_PLAYGROUND_NEMOTRON_SESSION_HEADER
        sync: false
      - key: PG_PLAYGROUND_NEMOTRON_TIMEOUT_S
        sync: false
